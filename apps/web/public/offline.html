<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne — HonoronsDieu</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0a0c; color: #f5f5f5;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
    .logo { background: linear-gradient(135deg, #f2e2a0, #b8912b); color: #141414;
            font: italic bold 28px Georgia, serif; padding: 14px 26px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 24px 0 8px; }
    p { color: #a1a1aa; max-width: 420px; line-height: 1.6; }
    button { margin-top: 20px; background: #c9a227; color: #141414; border: 0;
             padding: 12px 28px; border-radius: 12px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="logo">HD</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Impossible de charger la page. Vérifiez votre connexion internet puis réessayez —
     Honorons Dieu vous attend, ici, là-bas, partout.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
